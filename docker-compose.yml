services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camtrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camtrap}
      POSTGRES_DB: ${POSTGRES_DB:-camtrap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # exposed so the worker / scripts can also run outside Docker (e.g. on a local GPU)
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-camtrap}"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-camtrap}:${POSTGRES_PASSWORD:-camtrap}@db:5432/${POSTGRES_DB:-camtrap}
      STORAGE_DIR: /data/storage
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped  # retries if it starts before the API has migrated the DB
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-camtrap}:${POSTGRES_PASSWORD:-camtrap}@db:5432/${POSTGRES_DB:-camtrap}
      STORAGE_DIR: /data/storage
    volumes:
      - ./data:/data
      - mdmodels:/tmp/megadetector_models  # MegaDetector caches its weights here
      - ocrmodels:/root/.EasyOCR  # EasyOCR caches its models here
    depends_on:
      api:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  mdmodels:
  ocrmodels:
